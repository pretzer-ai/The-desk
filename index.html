<style>
  :root{
    --ink:#0B1220; --panel:#121C2E; --panelHi:#1A2740; --line:#243350;
    --gold:#E8B44A; --goldSoft:#8A6E2E; --loss:#1E3A8A; --lossSoft:#2B4CA0;
    --cream:#EDE7D6; --creamDim:#9AA3B2; --green:#4ADE80; --red:#F87171;
    --fDisplay:"DM Serif Display",Georgia,serif;
    --fMono:"IBM Plex Mono","SF Mono",Menlo,monospace;
    --fUI:"Inter",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:radial-gradient(1200px 600px at 50% -10%, var(--panel) 0%, var(--ink) 60%);
    font-family:var(--fUI); color:var(--cream);
    min-height:100vh; min-height:100dvh;
  }
  #app{max-width:460px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));}
  .eyebrow{font-family:var(--fMono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--creamDim);margin-bottom:10px;}
  h1.title{font-family:var(--fDisplay);margin:0;color:var(--cream);letter-spacing:-.01em;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .statLabel{font-family:var(--fMono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--creamDim);margin-bottom:6px;}
  .statValue{font-family:var(--fMono);font-size:22px;font-weight:600;color:var(--cream);}
  .navBtn{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;transition:background .12s,transform .12s;color:inherit;}
  .navBtn:active{transform:scale(.99);}
  .navLabel{font-family:var(--fDisplay);font-size:22px;color:var(--cream);}
  .navSub{font-family:var(--fMono);font-size:11px;color:var(--creamDim);letter-spacing:.08em;margin-top:2px;}
  .backBtn{background:transparent;border:1px solid var(--line);color:var(--creamDim);border-radius:20px;padding:6px 14px;font-family:var(--fMono);font-size:12px;cursor:pointer;margin-bottom:18px;}
  .chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;}
  .chipDot{width:12px;height:12px;border-radius:4px;display:inline-block;}
  .chipText{font-family:var(--fMono);font-size:12px;color:var(--cream);}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .mono{font-family:var(--fMono);}
  .calGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;margin-bottom:20px;}
  .calCell{border-radius:12px;padding:16px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;}
  button.primary{background:var(--gold);color:var(--ink);border:none;border-radius:10px;padding:13px;font-family:var(--fMono);font-weight:600;font-size:14px;cursor:pointer;width:100%;letter-spacing:.05em;}
  button.ghost{background:transparent;color:var(--creamDim);border:1px solid var(--line);border-radius:10px;padding:11px;font-family:var(--fMono);font-size:13px;cursor:pointer;}
  label.fld{display:block;font-family:var(--fMono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--creamDim);margin:0 0 6px;}
  input,select{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--cream);font-family:var(--fMono);font-size:14px;margin-bottom:14px;}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{flex:1;background:var(--ink);border:1px solid var(--line);color:var(--creamDim);border-radius:9px;padding:10px;font-family:var(--fMono);font-size:13px;cursor:pointer;}
  .seg button.on{border-color:var(--gold);color:var(--cream);}
  .delBtn{background:transparent;border:none;color:var(--red);font-family:var(--fMono);font-size:11px;cursor:pointer;padding:4px 8px;}
  .aff{margin-top:22px;width:100%;text-align:left;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;color:inherit;}
  .affKick{font-family:var(--fMono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldSoft);margin-bottom:8px;}
  .affText{font-family:var(--fDisplay);font-size:19px;line-height:1.3;color:var(--cream);}
  svg text{font-family:var(--fMono);}
  .hint{font-family:var(--fMono);font-size:10px;color:var(--creamDim);margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================= *
 *  THE DESK — personal forex tracker. All data stays on-device. *
 * ============================================================= */
const C = {
  ink:"#0B1220",panel:"#121C2E",panelHi:"#1A2740",line:"#243350",
  gold:"#E8B44A",goldSoft:"#8A6E2E",loss:"#1E3A8A",lossSoft:"#2B4CA0",
  cream:"#EDE7D6",creamDim:"#9AA3B2",green:"#4ADE80",red:"#F87171"
};
const PAIRS = ["EURUSD","GBPNZD"];
const STORE_KEY = "the-desk-v1";

/* ---------- seed data (first run only) ---------- */
const SEED = {
  weekStartBalance:171.80,
  // Deposits (+), withdrawals (-), and fees (-). Kind: deposit | withdrawal | fee
  cashflows:[],
  affirmations:[
    "Money flows to me through value, discipline, and opportunity.",
    "I am becoming more confident with money every day.",
    "I make calm, rational financial decisions.",
    "Wealth is built through consistency, not emotion.",
    "I respect money, and money respects me.",
    "Every dollar I manage wisely builds my future.",
    "I am capable of creating long-term financial freedom.",
    "I attract opportunities that increase my income.",
    "My financial habits improve daily.",
    "I choose abundance over scarcity thinking.",
    "I release fear and anxiety around money.",
    "I do not compare my financial journey to others.",
    "Delayed gratification creates lasting wealth.",
    "I control my emotions; my emotions do not control my finances.",
    "I can handle financial setbacks and recover stronger.",
    "Patience is one of my greatest financial strengths.",
    "I focus on probabilities, not perfection.",
    "I trust my process and continue learning.",
    "I am disciplined even when results are slow.",
    "I do not chase trades or revenge trade."
  ],
  // Every trade is one record. Stats/charts/calendar all derive from this.
  trades:[
    {id:1, pair:"GBPNZD", date:"2025-07-20", pl:1.12},
    {id:2, pair:"EURUSD", date:"2025-07-21", pl:3.04},
    {id:3, pair:"EURUSD", date:"2025-07-23", pl:-0.98},
    {id:4, pair:"EURUSD", date:"2025-07-24", pl:2.69}
  ],
  // Balance snapshots (manual equity points)
  balances:[
    {id:1, date:"2025-07-20", balance:172.92},
    {id:2, date:"2025-07-20", balance:175.96},
    {id:3, date:"2025-07-20", balance:175.80},
    {id:4, date:"2025-07-23", balance:174.82},
    {id:5, date:"2025-07-23", balance:174.60},
    {id:6, date:"2025-07-23", balance:177.29},
    {id:7, date:"2025-07-23", balance:227.29},
    {id:8, date:"2025-07-24", balance:227.18}
  ]
};

/* ---------- state ---------- */
let state = load();
let page = "home";
let affIdx = Math.floor(Math.random()*state.affirmations.length);

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(!s.cashflows) s.cashflows = [];   // migrate older saves
      return s;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function nextId(arr){ return arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1; }

/* ---------- helpers ---------- */
function money(n){ const v=Math.abs(n).toFixed(2); return (n<0?"-$":"$")+v; }
function sign(n){ return n>0?C.green : n<0?C.red : C.creamDim; }
function fmtDate(iso){
  // "2025-07-21" -> "Mon Jul 21"
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k==="style") n.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==="html") n.innerHTML=attrs[k];
    else n.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{ if(c!=null) n.append(c.nodeType?c:document.createTextNode(c)); });
  return n;
}

/* ---------- derived data ---------- */
function pairTrades(pair){ return state.trades.filter(t=>t.pair===pair).sort((a,b)=>a.date.localeCompare(b.date)); }
function pairStats(pair){
  const ts = pairTrades(pair);
  const wins = ts.filter(t=>t.pl>0).length;
  const losses = ts.filter(t=>t.pl<0).length;
  const totalPL = ts.reduce((s,t)=>s+t.pl,0);
  const decided = wins+losses;
  const winRate = decided? Math.round(wins/decided*100):0;
  return {ts,wins,losses,totalPL,winRate,decided};
}
function allStats(){
  const totalPL = state.trades.reduce((s,t)=>s+t.pl,0);
  return {totalPL};
}
/* cashflow totals */
function cashflowTotals(){
  let deposits=0, withdrawals=0, fees=0;
  state.cashflows.forEach(c=>{
    if(c.kind==="deposit") deposits+=c.amount;
    else if(c.kind==="withdrawal") withdrawals+=c.amount;
    else if(c.kind==="fee") fees+=c.amount;
  });
  return {deposits, withdrawals, fees, net:deposits-withdrawals-fees};
}
function currentBalance(){
  if(state.balances.length) return state.balances[state.balances.length-1].balance;
  return state.weekStartBalance;
}
/* daily calendar: group trades by date, sum pl -> win/loss/neutral */
function dailyDays(){
  const map = {};
  state.trades.forEach(t=>{ map[t.date]=(map[t.date]||0)+t.pl; });
  return Object.keys(map).sort().map(date=>{
    const pl = +map[date].toFixed(2);
    const result = pl>0?"win":pl<0?"loss":"neutral";
    return {date, pl, result};
  });
}

/* ============================================================= *
 *  Tiny SVG chart helpers (no libraries — fully offline)
 * ============================================================= */
function svgLine(series, opts={}){
  // series: [{name,color,points:[{x,y}]}], shared x by index
  const W=opts.w||400, H=opts.h||200, pad={t:14,r:12,b:26,l:40};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const allY = series.flatMap(s=>s.points.map(p=>p.y)).filter(v=>v!=null);
  const allX = series.flatMap(s=>s.points.map(p=>p.x));
  if(!allY.length) return el("div",{class:"hint"},"No data yet.");
  let minY=Math.min(...allY,0), maxY=Math.max(...allY,0);
  if(minY===maxY){minY-=1;maxY+=1;}
  const minX=Math.min(...allX), maxX=Math.max(...allX);
  const sx=x=> pad.l + (maxX===minX?0:(x-minX)/(maxX-minX))*iw;
  const sy=y=> pad.t + ih - (y-minY)/(maxY-minY)*ih;
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width","100%"); svg.setAttribute("height",H);
  const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // gridlines + y labels
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const yv=minY+(maxY-minY)*i/ticks; const yy=sy(yv);
    svg.append(mk("line",{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:C.line,"stroke-dasharray":"2 4"}));
    const lab=mk("text",{x:4,y:yy+3,fill:C.creamDim,"font-size":9}); lab.textContent="$"+yv.toFixed(0); svg.append(lab);
  }
  // zero line
  if(minY<0&&maxY>0){ svg.append(mk("line",{x1:pad.l,y1:sy(0),x2:W-pad.r,y2:sy(0),stroke:C.line})); }
  // x labels
  if(opts.xLabels){
    opts.xLabels.forEach((lb,i)=>{
      const xx=sx(i);
      const t=mk("text",{x:xx,y:H-8,fill:C.creamDim,"font-size":9,"text-anchor":"middle"}); t.textContent=lb; svg.append(t);
    });
  }
  // ref line
  if(opts.refY!=null){
    svg.append(mk("line",{x1:pad.l,y1:sy(opts.refY),x2:W-pad.r,y2:sy(opts.refY),stroke:C.goldSoft,"stroke-dasharray":"4 4"}));
  }
  series.forEach(s=>{
    let d=""; let started=false;
    s.points.forEach(p=>{
      if(p.y==null) return;
      d += (started?"L":"M")+sx(p.x)+" "+sy(p.y)+" "; started=true;
    });
    if(d) svg.append(mk("path",{d,fill:"none",stroke:s.color,"stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round"}));
    s.points.forEach(p=>{ if(p.y!=null) svg.append(mk("circle",{cx:sx(p.x),cy:sy(p.y),r:3,fill:s.color})); });
  });
  return svg;
}

function svgBars(items, opts={}){
  // items:[{label, values:[{v,color}]}] grouped bars
  const W=opts.w||400,H=opts.h||200,pad={t:14,r:12,b:26,l:40};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const allV=items.flatMap(it=>it.values.map(v=>v.v));
  if(!allV.length) return el("div",{class:"hint"},"No data yet.");
  let minV=Math.min(...allV,0), maxV=Math.max(...allV,0);
  if(minV===maxV){maxV+=1;}
  const sy=v=> pad.t+ih-(v-minV)/(maxV-minV)*ih;
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width","100%");svg.setAttribute("height",H);
  const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const vv=minV+(maxV-minV)*i/ticks; const yy=sy(vv);
    svg.append(mk("line",{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:C.line,"stroke-dasharray":"2 4"}));
    const lab=mk("text",{x:4,y:yy+3,fill:C.creamDim,"font-size":9}); lab.textContent=vv.toFixed(0); svg.append(lab);
  }
  if(minV<0&&maxV>0) svg.append(mk("line",{x1:pad.l,y1:sy(0),x2:W-pad.r,y2:sy(0),stroke:C.line}));
  const groupW=iw/items.length;
  items.forEach((it,gi)=>{
    const n=it.values.length;
    const bw=Math.min(28,(groupW*0.7)/n);
    const gx=pad.l+groupW*gi+groupW/2;
    it.values.forEach((val,vi)=>{
      const x=gx-(n*bw)/2 + vi*bw;
      const y0=sy(0), y1=sy(val.v);
      const top=Math.min(y0,y1), h=Math.abs(y1-y0);
      svg.append(mk("rect",{x,y:top,width:bw-2,height:Math.max(h,1),fill:val.color,rx:3}));
    });
    const t=mk("text",{x:gx,y:H-8,fill:C.creamDim,"font-size":9,"text-anchor":"middle"}); t.textContent=it.label; svg.append(t);
  });
  return svg;
}

    el("label",{class:"fld"},"Amount ($)"), cfIn,
    el("label",{class:"fld"},"Note"), cfNote,
    el("button",{class:"ghost",style:"width:100%",onclick:()=>{
      let amt=parseFloat(cfIn.value);
      if(isNaN(amt)||amt<=0){ cfIn.style.borderColor=C.red; return; }
      amt=+Math.abs(amt).toFixed(2);
      state.cashflows.push({id:nextId(state.cashflows),kind,date:cfDate.value,amount:amt,note:cfNote.value.trim()});
      // adjust running balance so the equity curve reflects it
      const base=currentBalance();
      const delta = kind==="deposit"? amt : -amt;

function Compare(){
  const wrap=el("div",{});

    stat(B+" P/L",money(sb.totalPL),C.lossSoft),
    stat(A+" Win %",sa.winRate+"%",C.gold),
    stat(B+" Win %",sb.winRate+"%",C.lossSoft)
  )));

  // grouped metric bars
  const metrics=[
    {label:"P/L",values:[{v:+sa.totalPL.toFixed(2),color:C.gold},{v:+sb.totalPL.toFixed(2),color:C.lossSoft}]},
    {label:"Wins",values:[{v:sa.wins,color:C.gold},{v:sb.wins,color:C.lossSoft}]},
    {label:"Losses",values:[{v:sa.losses,color:C.gold},{v:sb.losses,color:C.lossSoft}]},
    {label:"Win%",values:[{v:sa.winRate,color:C.gold},{v:sb.winRate,color:C.lossSoft}]}
  ];

  const cum=ts=>{let r=0;return ts.map(t=>(r+=t.pl,+r.toFixed(2)));};

  const ptsA=Array.from({length:maxLen},(_,i)=>({x:i,y:ca[i]??null}));
  const ptsB=Array.from({length:maxLen},(_,i)=>({x:i,y:cb[i]??null}));
  const cP=panel(eyebrow("Cumulative P/L by Trade"));
  cP.append(svgLine(
    [{name:A,color:C.gold,points:ptsA},{name:B,color:C.lossSoft,points:ptsB}],
    {xLabels:Array.from({length:maxLen},(_,i)=>"#"+(i+1))}
  ));
  cP.append(el("div",{class:"hint"},"Aligned by trade number, not date."));

    const delta=b.balance-prev;
    logP.append(el("div",{class:"row"},
      el("span",{class:"mono",style:`font-size:13px;color:${C.cream}`},fmtDate(b.date)),
      el("div",{style:"display:flex;gap:12px;align-items:center"},
        el("span",{class:"mono",style:`font-size:12px;color:${sign(delta)};min-width:60px;text-align:right`}, delta===0?"—":money(delta)),
        el("span",{class:"mono",style:`font-size:14px;font-weight:600;color:${C.cream};min-width:74px;text-align:right`},money(b.balance)),
        el("button",{class:"delBtn",onclick:()=>{ state.balances=state.balances.filter(x=>x.id!==b.id); save(); render(); }},"×")
      )
    ));
  });
  wrap.append(logP);

  // Cashflow log
  if(state.cashflows.length){
    const cfP=panel(eyebrow("Deposits · Withdrawals · Fees"));
    const kindColor=k=> k==="deposit"?C.green : C.red;
    const kindLabel=k=> k==="deposit"?"Deposit" : k==="withdrawal"?"Withdrawal" : "Fee";
    state.cashflows.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>{
      const signed = c.kind==="deposit"? c.amount : -c.amount;
      cfP.append(el("div",{class:"row"},
        el("div",{style:"display:flex;flex-direction:column;gap:2px"},
          el("span",{class:"mono",style:`font-size:13px;color:${C.cream}`},fmtDate(c.date)),
          el("span",{class:"mono",style:`font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${C.creamDim}`},
            kindLabel(c.kind)+(c.note?" · "+c.note:""))
        ),
        el("div",{style:"display:flex;gap:12px;align-items:center"},
          el("span",{class:"mono",style:`font-size:14px;font-weight:600;color:${kindColor(c.kind)};min-width:70px;text-align:right`},money(signed)),
          el("button",{class:"delBtn",onclick:()=>{ state.cashflows=state.cashflows.filter(x=>x.id!==c.id); save(); render(); }},"×")
        )
      ));
    });
    wrap.append(cfP);
  }

  return wrap;
}
function Fees(){
  const wrap=el("div",{});
  wrap.append(pageTitle("Ledger","Fees"));

  const feeItems=state.cashflows.filter(c=>c.kind==="fee").sort((a,b)=>a.date.localeCompare(b.date));
  const totalFees=feeItems.reduce((s,c)=>s+c.amount,0);
  const thisMonth=(()=>{
    const now=new Date(); const ym=now.toISOString().slice(0,7);
    return feeItems.filter(c=>c.date.startsWith(ym)).reduce((s,c)=>s+c.amount,0);
  })();

  wrap.append(panel(el("div",{class:"grid2"},
    stat("Total Fees Paid",money(totalFees),C.red),
    stat("This Month",money(thisMonth),C.red),
    stat("Fee Entries",feeItems.length,C.creamDim),
    stat("Avg per Entry",feeItems.length?money(totalFees/feeItems.length):"$0.00",C.creamDim)
  )));

  const logP=panel(eyebrow("Fee Log"));
  if(!feeItems.length) logP.append(el("div",{class:"hint"},"No fees logged yet. Add one from Add Trade → Money In / Out."));
  feeItems.forEach(c=>{
    logP.append(el("div",{class:"row"},
      el("div",{style:"display:flex;flex-direction:column;gap:2px"},
        el("span",{class:"mono",style:`font-size:13px;color:${C.cream}`},fmtDate(c.date)),
        c.note?el("span",{class:"mono",style:`font-size:11px;color:${C.creamDim}`},c.note):null
      ),
      el("div",{style:"display:flex;gap:12px;align-items:center"},
        el("span",{class:"mono",style:`font-size:14px;font-weight:600;color:${C.red};min-width:70px;text-align:right`},money(-c.amount)),
        el("button",{class:"delBtn",onclick:()=>{ state.cashflows=state.cashflows.filter(x=>x.id!==c.id); save(); render(); }},"×")
      )
    ));
  });
  wrap.append(logP);
  wrap.append(el("div",{class:"hint"},"Log a fee from Add Trade → Money In / Out → Fee."));
  return wrap;
}

function Settings(){
  const wrap=el("div",{});
  wrap.append(pageTitle("Data","Settings"));

  wrap.append(panel(
    eyebrow("Storage"),
    el("div",{class:"hint",style:"margin-top:0"},
      state.trades.length+" trades · "+state.balances.length+" balance points · "+state.cashflows.length+" cashflow entries. Stored only on this device.")
  ));

  // ---- Export: dump full state as JSON so it can be carried to another device ----
  const exportBox=el("textarea",{readonly:"",rows:"6",style:"width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--cream);font-family:var(--fMono);font-size:11px;margin-bottom:10px;resize:vertical"});
  const exportStatus=el("div",{class:"hint",style:"margin-top:0"},"");
  wrap.append(panel(
    eyebrow("Export Data"),
    el("div",{class:"hint",style:"margin-top:0;margin-bottom:12px"},
      "Copy this to another device's Import box to sync data across phone and desktop. Each device keeps its own separate copy — this is a manual, one-time snapshot, not live sync."),
    el("button",{class:"ghost",style:"width:100%;margin-bottom:10px",onclick:()=>{
      exportBox.value=JSON.stringify(state);
      exportBox.style.display="block";
      exportBox.select();
      navigator.clipboard?.writeText(exportBox.value)
        .then(()=>{ exportStatus.textContent="Copied to clipboard. Paste it into Import on the other device."; })
        .catch(()=>{ exportStatus.textContent="Couldn't auto-copy — tap the box above, select all, and copy manually."; });
    }},"Generate & Copy Backup"),
    exportBox,
    exportStatus
  ));
  exportBox.style.display="none";

  // ---- Import: paste JSON from another device and overwrite local state ----
  const importBox=el("textarea",{rows:"6",placeholder:"Paste exported data here",style:"width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--cream);font-family:var(--fMono);font-size:11px;margin-bottom:10px;resize:vertical"});
  const importStatus=el("div",{class:"hint",style:"margin-top:0"},"");
  wrap.append(panel(
    eyebrow("Import Data"),
    el("div",{class:"hint",style:"margin-top:0;margin-bottom:12px"},
      "Overwrites everything on THIS device with the pasted backup. Export from here first if you don't want to lose anything."),
    importBox,
    el("button",{class:"ghost",style:"width:100%",onclick:()=>{
      let parsed;
      try{ parsed=JSON.parse(importBox.value); }
      catch(e){ importStatus.textContent="That doesn't look like valid backup data."; importStatus.style.color=C.red; return; }
      if(!parsed || !Array.isArray(parsed.trades) || !Array.isArray(parsed.balances) || !Array.isArray(parsed.cashflows)){
        importStatus.textContent="Missing trades/balances/cashflows — is this a Desk backup?"; importStatus.style.color=C.red; return;
      }
      if(!confirm("Replace all data on this device with the pasted backup? This cannot be undone.")) return;
      state = {
        weekStartBalance: typeof parsed.weekStartBalance==="number"?parsed.weekStartBalance:0,
        cashflows: parsed.cashflows,
        affirmations: Array.isArray(parsed.affirmations)&&parsed.affirmations.length?parsed.affirmations:state.affirmations,
        trades: parsed.trades,
        balances: parsed.balances
      };
      save(); nav("home");
    }},"Import & Overwrite")
  ));

  const startIn=el("input",{type:"number",step:"0.01",placeholder:"e.g. 229.07",inputmode:"decimal"});
  wrap.append(panel(
    eyebrow("Danger Zone"),
    el("div",{class:"hint",style:`margin-top:0;margin-bottom:12px;color:${C.red}`},
      "Reset permanently deletes every trade, balance point, and fee/deposit/withdrawal on this device. This cannot be undone."),
    el("label",{class:"fld"},"New starting balance (optional)"), startIn,
    el("button",{class:"ghost",style:`width:100%;border-color:${C.red};color:${C.red}`,onclick:()=>{
      if(!confirm("Delete all trades, balances, and fees on this device? This cannot be undone.")) return;
      if(!confirm("Really sure? Type OK again to permanently reset The Desk.")) return;
      const sb=parseFloat(startIn.value);
      state = {
        weekStartBalance: isNaN(sb)?0:sb,
        cashflows: [],
        affirmations: state.affirmations,
        trades: [],
        balances: []
      };
      save(); nav("home");
    }},"Reset App")
  ));

  return wrap;
}

function nav(p){ page=p; window.scrollTo(0,0); render(); }
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(page!=="home"){
    app.append(el("button",{class:"backBtn",onclick:()=>nav("home")},"← The Desk"));
  }
  let view;
  switch(page){
    case "add": view=AddTrade(); break;
    case "calendar": view=Calendar(); break;
    case "EURUSD": view=PairPage("EURUSD"); break;
    case "GBPNZD": view=PairPage("GBPNZD"); break;
    case "compare": view=Compare(); break;
    case "balance": view=Balance(); break;
    case "fees": view=Fees(); break;
    case "settings": view=Settings(); break;
    default: view=Home();
  }
  app.append(view);
}
render();
</script>
</body>
</html>
